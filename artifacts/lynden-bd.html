                    positions.push(x, y, -hz,  x, y, hz);
                }
            }

            const grid3DGeometry = new THREE.BufferGeometry();
            grid3DGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            grid3DGeometry.computeBoundingSphere();

            const grid3DMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    uColor: { value: new THREE.Color(CONFIG.grid3DColor) },
                    uOpacity: { value: CONFIG.grid3DOpacity },
                    uCenter: { value: new THREE.Vector3(0, 0, 0) },
                    uFadeRadius: { value: new THREE.Vector3(
                        Math.max(0.0001, hx * CONFIG.grid3DFadeRadiusMultX),
                        Math.max(0.0001, hy * CONFIG.grid3DFadeRadiusMultY),
                        Math.max(0.0001, hz * CONFIG.grid3DFadeRadiusMultZ)
                    ) },
                    uFadeStart: { value: CONFIG.grid3DFadeStart },
                    uFadeEnd: { value: CONFIG.grid3DFadeEnd },
                    uFadePower: { value: CONFIG.grid3DFadePower }
                },
                vertexShader: `
                    varying vec3 vWorldPos;
                    void main() {
                        vec4 worldPos = modelMatrix * vec4(position, 1.0);
                        vWorldPos = worldPos.xyz;
                        gl_Position = projectionMatrix * viewMatrix * worldPos;
                    }
                `,
                fragmentShader: `
                    uniform vec3 uColor;
                    uniform float uOpacity;
                    uniform vec3 uCenter;
                    uniform vec3 uFadeRadius;
                    uniform float uFadeStart;
                    uniform float uFadeEnd;
                    uniform float uFadePower;
                    varying vec3 vWorldPos;
                    void main() {
                        vec3 n = abs(vWorldPos - uCenter) / uFadeRadius;
                        float d = length(n);
                        float a = 1.0 - smoothstep(uFadeStart, uFadeEnd, d);
                        a = pow(clamp(a, 0.0, 1.0), uFadePower) * uOpacity;
                        if (a < 0.002) discard;
                        gl_FragColor = vec4(uColor, a);
                    }
                `,
                transparent: true,
                depthWrite: false
            });

            const grid3D = new THREE.LineSegments(grid3DGeometry, grid3DMaterial);
            grid3D.position.set(CONFIG.grid3DOffsetX, CONFIG.grid3DOffsetY, CONFIG.grid3DOffsetZ);
            grid3D.frustumCulled = false;
            scene.add(grid3D);
            grid3D.updateMatrixWorld(true);
            grid3DMaterial.uniforms.uCenter.value.setFromMatrixPosition(grid3D.matrixWorld);
            window.grid3DMesh = grid3D;
        }

        // ============================================
        // SHADERS
        // ============================================
        const vertexShader = `
            uniform float pointSize;
            uniform float craftJitter;
            uniform float randomSize;
            uniform bool pointSizeByDistance;
            uniform float minDistance;
            uniform float maxDistance;
            uniform float minPointSize;
            uniform float maxPointSize;
            uniform float audioLevel;
            uniform float audioPointSizeBoost;
            uniform float audioBands[8];
            uniform vec3 customCameraPos;
            uniform float introRevealRadius;
            uniform float introWaveThickness;
            uniform float introWaveOffset;
            uniform float introPeakSize;
            uniform float introAssemblyRadius;
            uniform float introAssemblyWaveThickness;
            uniform float introAssemblyWaveOffset;
            uniform float introQuantize;
            uniform float introTwistAmount;
            uniform float introTwistSpinSpeed;
            uniform int introTwistAxis;
            uniform float introTwistLength;
            uniform vec3 introCenterPoint;
            uniform float cloudRadius;
            uniform float timeSeconds;

            // Scan uniforms
            uniform float scan1Pos;
            uniform float scan1Intensity;
            uniform int scan1Axis;
            uniform float scan1FrontSharp;
            uniform float scan1TailSoft;
            uniform float scan1Strength;
            uniform float scan1Displace;
            uniform vec3 scan1ColorX;
            uniform vec3 scan1ColorY;
            uniform vec3 scan1ColorZ;
            uniform float scan2Pos;
            uniform float scan2Intensity;
            uniform int scan2Axis;
            uniform vec3 scan2Color;
            uniform float scan2FrontSharp;
            uniform float scan2TailSoft;
            uniform float scan2Strength;
            uniform bool scan2Invert;

            // Pulse uniform
            uniform float pulseWavePos;    // radial position of wave (0..cloudRadius)
            uniform float pulseStrength;   // how much to displace (from energy)

            // Flicker uniforms (3 layers)
            uniform float flickerSeed;     // changes on flicker trigger
            uniform float flickerFade;     // 1.0 on trigger, decays to 0
            uniform float flicker2Seed;
            uniform float flicker2Fade;
            uniform float flicker3Seed;
            uniform float flicker3Fade;
            uniform float flicker1Thresh;
            uniform float flicker2Thresh;
            uniform float flicker3Thresh;
            uniform vec3 flicker2Color;
            uniform vec3 flicker3Color;

            uniform float noiseAmp;
            uniform float noiseScale;
            uniform float noiseSpeed;
            uniform vec3 noiseSeed;
            
            attribute vec3 color;
            attribute float randomSizeFactor;
            attribute vec3 scatteredPos;
            varying vec3 vColor;
            varying float vDist;
            varying float vScan1;
            varying vec3 vScan1Color;
            varying float vScan2;
            varying vec3 vScan2Color;
            varying float vFlicker;
            varying vec3 vFlickerColor;
            
            vec3 rotateAroundAxis(vec3 p, vec3 axis, float angle) {
                float c = cos(angle);
                float s = sin(angle);
                float t = 1.0 - c;
                mat3 rot = mat3(
                    t*axis.x*axis.x + c, t*axis.x*axis.y - s*axis.z, t*axis.x*axis.z + s*axis.y,
                    t*axis.x*axis.y + s*axis.z, t*axis.y*axis.y + c, t*axis.y*axis.z - s*axis.x,
                    t*axis.x*axis.z - s*axis.y, t*axis.y*axis.z + s*axis.x, t*axis.z*axis.z + c
                );
                return rot * p;
            }

            vec3 cheapNoiseVec(vec3 p) {
                float nx = sin(dot(p, vec3(12.9898, 78.233, 37.719)));
                float ny = sin(dot(p, vec3(39.3468, 11.135, 83.155)));
                float nz = sin(dot(p, vec3(73.156, 52.235, 9.151)));
                return vec3(nx, ny, nz);
            }

            
            void main() {
                vColor = color;
                
                vec3 relPos = position - introCenterPoint;
                float realDist = length(relPos);
                float assemblyWaveCenter = introAssemblyRadius - introAssemblyWaveOffset;
                float assemblyProgress = 0.0;
                
                if (introAssemblyRadius > 0.0) {
                    float distFromWave = realDist - assemblyWaveCenter;
                    assemblyProgress = clamp(distFromWave / introAssemblyWaveThickness, 0.0, 1.0);
                    assemblyProgress = 1.0 - assemblyProgress;
                    assemblyProgress = assemblyProgress * assemblyProgress * (3.0 - 2.0 * assemblyProgress);
                }
                
                vec3 quantizedPos = position;
                if (introQuantize > 0.0) {
                    quantizedPos = introCenterPoint + round((position - introCenterPoint) / introQuantize) * introQuantize;
                }
                
                vec3 twistedPos = quantizedPos;
                if (introTwistAmount != 0.0) {
                    vec3 rel = quantizedPos - introCenterPoint;
                    vec3 axis = introTwistAxis == 0 ? vec3(1,0,0) : (introTwistAxis == 1 ? vec3(0,1,0) : vec3(0,0,1));
                    float coord = dot(rel, axis);
                    float safeLen = max(introTwistLength, 0.000001);
                    float angle = (coord / safeLen) * (introTwistAmount + introTwistSpinSpeed * timeSeconds);
                    twistedPos = introCenterPoint + rotateAroundAxis(rel, axis, angle);
                }

                vec3 finalPos = mix(scatteredPos, twistedPos, assemblyProgress);

                // Stage noise
                if (noiseAmp != 0.0) {
                    vec3 np = (finalPos - introCenterPoint) * noiseScale + noiseSeed;
                    np += vec3(timeSeconds * noiseSpeed);
                    vec3 nv = cheapNoiseVec(np);
                    float audioNoiseMult = 1.0;
                    finalPos += nv * noiseAmp * audioNoiseMult;
                }

                // ========== AUDIO REACTIVE ==========
                vScan1 = 0.0;
                vScan1Color = vec3(0.0);
                vScan2 = 0.0;
                vScan2Color = scan2Color;
                vFlicker = 0.0;
                vFlickerColor = vec3(0.0);

                if (cloudRadius > 0.0) {
                    vec3 np = (finalPos - introCenterPoint) / max(cloudRadius, 0.001);
                    float r = length(finalPos - introCenterPoint);
                    float rNorm = clamp(r / cloudRadius, 0.0, 1.0);

                    // ======= PULSE: smooth radial wave =======
                    if (pulseStrength > 0.001) {
                        float waveWidth = 0.12;
                        float maxR = cloudRadius * 1.2;
                        float waveDist = r - pulseWavePos;
                        // Smooth bell curve: points near wave front get displaced
                        float waveMask = exp(-waveDist * waveDist / (2.0 * waveWidth * waveWidth));
                        // Ease: weaker at edges of travel
                        float travelPhase = clamp(pulseWavePos / maxR, 0.0, 1.0);
                        float ease = sin(travelPhase * 3.14159);
                        // Displacement outward, constant strength (no per-frame jitter)
                        vec3 dir = normalize(finalPos - introCenterPoint + vec3(0.0001));
                        finalPos += dir * waveMask * pulseStrength * ease * 0.06;
                    }

                    // ======= SCAN 1: neon sweep, configurable sharpness =======
                    if (scan1Intensity > 0.001) {
                        float s1pos = (scan1Pos * 2.0 - 1.0) * 0.95;
                        float s1coord = 0.0;
                        if (scan1Axis == 0) s1coord = np.x;
                        else if (scan1Axis == 1) s1coord = np.y;
                        else s1coord = np.z;

                        float diff1 = s1coord - s1pos;
                        float front1 = 1.0 - smoothstep(0.0, scan1FrontSharp, diff1);
                        float tail1 = 1.0 - smoothstep(0.0, scan1TailSoft, -diff1);
                        float s1mask = front1 * tail1;
                        float s1 = s1mask * scan1Intensity;

                        if (s1 > 0.005) {
                            vScan1 = s1 * scan1Strength;
                            if (scan1Axis == 0) vScan1Color = scan1ColorX;
                            else if (scan1Axis == 1) vScan1Color = scan1ColorY;
                            else vScan1Color = scan1ColorZ;

                            if (scan1Axis == 0) finalPos.z += s1 * scan1Displace;
                            else if (scan1Axis == 1) finalPos.x += s1 * scan1Displace;
                            else finalPos.y += s1 * scan1Displace;
                        }
                    }

                    // ======= SCAN 2: luminance/color sweep, configurable =======
                    if (scan2Intensity > 0.001) {
                        float s2pos = (scan2Pos * 2.0 - 1.0) * 0.95;
                        float s2coord = 0.0;
                        if (scan2Axis == 0) s2coord = np.x;
                        else if (scan2Axis == 1) s2coord = np.y;
                        else s2coord = np.z;

                        float diff = s2coord - s2pos;
                        float frontMask = 1.0 - smoothstep(0.0, scan2FrontSharp, diff);
                        float tailMask = 1.0 - smoothstep(0.0, scan2TailSoft, -diff);
                        float s2mask = frontMask * tailMask;
                        vScan2 = s2mask * scan2Intensity * scan2Strength;
                        // Pass invert flag through sign trick
                        if (scan2Invert) vScan2 = -vScan2;
                    }

                    // ======= FLICKER: 3 layers, different triggers/colors =======
                    vFlicker = 0.0;
                    vFlickerColor = vec3(0.0);

                    // Flicker 1: bass trigger, point's own saturated color
                    if (flickerFade > 0.01) {
                        float h1 = fract(sin(dot(position.xyz, vec3(12.9898, 78.233, 45.164)) + flickerSeed) * 43758.5453);
                        if (h1 > flicker1Thresh) {
                            vFlicker = flickerFade;
                            vFlickerColor = clamp(color * 2.0 + vec3(0.1), 0.0, 1.5);
                        }
                    }
                    // Flicker 2: mid trigger
                    if (flicker2Fade > 0.01) {
                        float h2 = fract(sin(dot(position.xyz, vec3(39.346, 11.135, 83.155)) + flicker2Seed) * 43758.5453);
                        if (h2 > flicker2Thresh) {
                            float f2 = flicker2Fade;
                            if (f2 > vFlicker) {
                                vFlicker = f2;
                                vFlickerColor = flicker2Color;
                            }
                        }
                    }
                    // Flicker 3: high trigger
                    if (flicker3Fade > 0.01) {
                        float h3 = fract(sin(dot(position.xyz, vec3(73.156, 52.235, 9.151)) + flicker3Seed) * 43758.5453);
                        if (h3 > flicker3Thresh) {
                            float f3 = flicker3Fade;
                            if (f3 > vFlicker) {
                                vFlicker = f3;
                                vFlickerColor = flicker3Color;
                            }
                        }
                    }
                }

                vec3 jitter = vec3(
                    fract(sin(dot(position, vec3(12.9898,78.233,37.719))) * 43758.5453),
                    fract(sin(dot(position, vec3(39.346,11.135,83.155))) * 47453.5453),
                    fract(sin(dot(position, vec3(73.156,52.235,9.151))) * 43758.5453)) - 0.5;
                finalPos += jitter * craftJitter;
                vec4 mvPosition = modelViewMatrix * vec4(finalPos, 1.0);
                vec4 worldPosition = modelMatrix * vec4(finalPos, 1.0);
                gl_Position = projectionMatrix * mvPosition;
                
                vDist = length(finalPos - introCenterPoint);

                float finalSize = pointSize;
                
                float waveCenter = introRevealRadius - introWaveOffset;
                float distFromWave = abs(vDist - waveCenter);
                float rawT = 1.0 - clamp(distFromWave / introWaveThickness, 0.0, 1.0);
                float smoothT = rawT * rawT * (3.0 - 2.0 * rawT);
                float waveMult = 1.0 + smoothT * (introPeakSize - 1.0);
                finalSize *= waveMult;
                
                float randomMult = 1.0 + randomSize * (randomSizeFactor - 0.5) * 2.0;
                finalSize *= randomMult;
                
                if (pointSizeByDistance) {
                    float dist = distance(customCameraPos, worldPosition.xyz);
                    float t = clamp((dist - minDistance) / (maxDistance - minDistance), 0.0, 1.0);
                    float distanceMult = mix(minPointSize, maxPointSize, t);
                    finalSize *= distanceMult;
                }
                
                // Near-camera fade: shrink points smoothly as they approach clip plane
                float camDist = -mvPosition.z;
                float nearFade = smoothstep(0.0, 0.15, camDist);
                finalSize *= nearFade;
                
                gl_PointSize = finalSize * (300.0 / -mvPosition.z);
            }
        `;

        const fragmentShader = `
            uniform float craftExposure;
            uniform float craftContrast;
            uniform float craftSaturation;
            uniform float scanSaturation;
            uniform float scanContrast;
            uniform float introRevealRadius;
            uniform float introRimThickness;
            uniform vec3 introRimColor;
            varying vec3 vColor;
            varying float vDist;
            varying float vScan1;
            varying vec3 vScan1Color;
            varying float vScan2;
            varying vec3 vScan2Color;
            varying float vFlicker;
            varying vec3 vFlickerColor;
            
            void main() {
                vec2 center = gl_PointCoord - vec2(0.5);
                float dist = length(center);
                if (dist > 0.5) discard;
                
                if (vDist > introRevealRadius) discard;
                
                float edgeFade = smoothstep(introRevealRadius - introRimThickness, introRevealRadius, vDist);
                // Grade the scan in display space, keeping the wave colours independent.
                vec3 scanColor = pow(max(vColor, vec3(0.0)), vec3(1.0 / 2.2));
                float scanLuma = dot(scanColor, vec3(0.2126, 0.7152, 0.0722));
                scanColor = clamp(mix(vec3(scanLuma), scanColor, scanSaturation), 0.0, 1.0);
                // A soft contrast curve preserves black/white endpoints without clipping shadows.
                scanColor += (scanContrast - 1.0) * (scanColor - 0.5) * (1.0 - abs(2.0 * scanColor - 1.0));
                vec3 gradedColor = pow(clamp(scanColor, 0.0, 1.0), vec3(2.2));
                vec3 baseColor = mix(gradedColor, introRimColor, edgeFade * 0.5);
                vec3 finalColor = baseColor;
                float alpha = 1.0;

                // SCAN 1: neon color overlay
                if (vScan1 > 0.01) {
                    vec3 neon = normalize(vScan1Color + 0.001) * 1.3;
                    finalColor = mix(finalColor, neon, vScan1 * 0.8);
                }

                // SCAN 2: color sweep (positive = lighten/color, negative = darken/invert)
                if (abs(vScan2) > 0.01) {
                    if (vScan2 > 0.0) {
                        finalColor = mix(finalColor, vScan2Color, vScan2);
                    } else {
                        // Invert mode: darken toward black
                        finalColor = finalColor * (1.0 + vScan2);
                    }
                }

                // FLICKER: colored points then fade via opacity
                if (vFlicker > 0.01) {
                    finalColor = mix(finalColor, vFlickerColor, vFlicker * 0.7);
                    // Fade out: as flickerFade decays, points go transparent
                    alpha = vFlicker;
                }

                vec3 correctedColor = pow(finalColor, vec3(1.0/2.2));
                float luma = dot(correctedColor, vec3(.2126, .7152, .0722));
                correctedColor = mix(vec3(luma), correctedColor, craftSaturation);
                correctedColor = (correctedColor - .5) * craftContrast + .5;
                gl_FragColor = vec4(max(vec3(0.), correctedColor * craftExposure), alpha);
            }
        `;

        // ============================================
        // LOAD WITH CACHE
        // ============================================
        function getCorsProxyUrl(url) {
            if (!url.startsWith('http') || url.includes('corsproxy') || url.includes('allorigins')) {
                return url;
            }
            if (url.includes('dropbox.com')) {
                return url.replace('www.dropbox.com', 'dl.dropboxusercontent.com').replace('&dl=1', '');
            }
            return url;
        }

        async function loadPLY(url) {
            const loadStartTime = Date.now();
            const loadingOverlay = document.getElementById('loading-overlay');
            const enterBtn = document.getElementById('loading-enter-btn');
            const statsEl = document.getElementById('loading-stats');
            const controlsHint = document.getElementById('controls-hint');
            let geometry;
            let arrayBuffer = null;

            try {
                const cachedData = await cache.get(url);
                
                if (cachedData) {
                    console.log('✅ Loading from cache');
                    arrayBuffer = cachedData;
                    const totalStr = formatBytes(cachedData.byteLength || 0);
                    if (enterBtn) enterBtn.textContent = 'loading';
                    if (statsEl) statsEl.textContent = totalStr + ' · cached';

                    const loader = new PLYLoader();
                    await new Promise(requestAnimationFrame);
                    geometry = loader.parse(cachedData);
                } else {
                    console.log('📥 Loading from network');
                    if (enterBtn) enterBtn.textContent = 'loading';
                    if (statsEl) statsEl.textContent = 'downloading...';

                    const fileLoader = new THREE.FileLoader();
                    fileLoader.setResponseType('arraybuffer');
                    arrayBuffer = await new Promise((resolve, reject) => {
                        fileLoader.load(
                            url,
                            (buf) => resolve(buf),
                            (xhr) => {
                                if (xhr.total) {
                                    const percent = Math.min(99, (xhr.loaded / xhr.total) * 100);
                                    const totalStr = formatBytes(xhr.total);
                                    const loadedStr = formatBytes(xhr.loaded);
                                    if (enterBtn) enterBtn.textContent = 'loading ' + Math.floor(percent) + '%';
                                    if (statsEl) statsEl.textContent = loadedStr + ' / ' + totalStr;
                                }
                            },
                            (error) => reject(error)
                        );
                    });

                    // Save to cache in background
                    cache.set(url, arrayBuffer)
                        .then(() => console.log('💾 Saved to cache'))
                        .catch((err) => console.warn('Cache save failed', err));

                    const loader = new PLYLoader();
                    if (statsEl) statsEl.textContent = 'parsing...';
                    await new Promise(requestAnimationFrame);
                    geometry = loader.parse(arrayBuffer);
                    }
                
                await new Promise(requestAnimationFrame);
                processAndDisplayGeometry(geometry);
                
                const bufTotalStr = formatBytes(arrayBuffer ? arrayBuffer.byteLength : 0);
                if (statsEl) statsEl.textContent = bufTotalStr;

                // Show canvas behind overlay, enable OPEN button
                setCanvasVisible(true, 450);
                
                if (enterBtn) {
                    enterBtn.disabled = false;
                    enterBtn.textContent = 'open';
                    enterBtn.classList.add('ready');
                    
                    enterBtn.addEventListener('click', () => {
                        enterBtn.classList.remove('ready');
                        enterBtn.style.opacity = '0';
                        fadeOutLoadingOverlay();
                        
                        if (CONFIG.introAnimation.enabled && !CONFIG.debugMode) {
                            playIntroAnimation();
                        } else {
                            startStageSystem();
                            showControlsHint();
                        }
                    }, { once: true });
                } else {
                    // Fallback if button not found
                    fadeOutLoadingOverlay();
                    if (CONFIG.introAnimation.enabled && !CONFIG.debugMode) {
                        playIntroAnimation();
                    } else {
                        startStageSystem();
                        showControlsHint();
                    }
                }
            } catch (error) {
                console.error('Error loading:', error);
                const enterBtn2 = document.getElementById('loading-enter-btn');
                if (enterBtn2) enterBtn2.textContent = 'error';
                const statsEl2 = document.getElementById('loading-stats');
                if (statsEl2) statsEl2.textContent = 'check console';
}
        }

        function processAndDisplayGeometry(geometry) {
            if (CONFIG.normalizeCloud) {
                geometry.computeBoundingBox();
                const bbox = geometry.boundingBox;
                const center = new THREE.Vector3();
                bbox.getCenter(center);
                
                const size = new THREE.Vector3();
                bbox.getSize(size);
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 2.0 / maxDim;
                
                const positions = geometry.attributes.position;
                for (let i = 0; i < positions.count; i++) {
                    positions.setXYZ(
                        i,
                        (positions.getX(i) - center.x) * scale,
                        (positions.getY(i) - center.y) * scale,
                        (positions.getZ(i) - center.z) * scale
                    );
                }
                positions.needsUpdate = true;
                geometry.computeBoundingBox();
            }
            
            const positions = geometry.attributes.position;
            const randomSizes = new Float32Array(positions.count);
            const scatteredPositions = new Float32Array(positions.count * 3);
            
            function seededRandom(seed) {
                let x = Math.sin(seed++) * 10000;
                return x - Math.floor(x);
            }
            
            let seed = CONFIG.introAnimation.scatterSeed;
            const centerPoint = new THREE.Vector3(...CONFIG.introAnimation.centerPoint);
            
            for (let i = 0; i < positions.count; i++) {
                randomSizes[i] = seededRandom(i + CONFIG.craft.seed);
                
                if (CONFIG.introAnimation.scatterEffect) {
                    const px = positions.getX(i);
                    const py = positions.getY(i);
                    const pz = positions.getZ(i);
                    
                    const limit = (CONFIG.introAnimation.scatterDistanceLimit || 0) * (CONFIG.introAnimation.scatterAmount || 1);
                    
                    if (CONFIG.introAnimation.scatterShape === 'sphere') {
                        const theta = seededRandom(seed++) * Math.PI * 2;
                        const phi = Math.acos(2 * seededRandom(seed++) - 1);
                        const r = Math.pow(seededRandom(seed++), 1/3) * limit;
                        
                        scatteredPositions[i * 3] = px + r * Math.sin(phi) * Math.cos(theta);
                        scatteredPositions[i * 3 + 1] = py + r * Math.sin(phi) * Math.sin(theta);
                        scatteredPositions[i * 3 + 2] = pz + r * Math.cos(phi);
                    } else {
                        const angle = seededRandom(seed++) * Math.PI * 2;
                        const radius = seededRandom(seed++) * limit;
                        const height = (seededRandom(seed++) - 0.5) * 2 * limit;
                        
                        scatteredPositions[i * 3] = px + Math.cos(angle) * radius;
                        scatteredPositions[i * 3 + 1] = py + height;
                        scatteredPositions[i * 3 + 2] = pz + Math.sin(angle) * radius;
                    }
                } else {
                    scatteredPositions[i * 3] = positions.getX(i);
                    scatteredPositions[i * 3 + 1] = positions.getY(i);
                    scatteredPositions[i * 3 + 2] = positions.getZ(i);
                }
            }
            geometry.setAttribute('randomSizeFactor', new THREE.BufferAttribute(randomSizes, 1));
            geometry.setAttribute('scatteredPos', new THREE.BufferAttribute(scatteredPositions, 3));
            
            const material = new THREE.ShaderMaterial({
                uniforms: {
                    pointSize: { value: CONFIG.pointSize },
                    scanSaturation: { value: CONFIG.scanColor.saturation },
                    scanContrast: { value: CONFIG.scanColor.contrast },
                    randomSize: { value: CONFIG.randomSize },
                    pointSizeByDistance: { value: CONFIG.pointSizeByDistance },
                    minDistance: { value: CONFIG.minDistance },
                    maxDistance: { value: CONFIG.maxDistance },
                    minPointSize: { value: CONFIG.minPointSize },
                    maxPointSize: { value: CONFIG.maxPointSize },
                    audioLevel: { value: 0.0 },
                    audioPointSizeBoost: { value: (CONFIG.audioReactive && typeof CONFIG.audioReactive.pointSizeBoost === 'number'
                        ? CONFIG.audioReactive.pointSizeBoost
                        : 0.6) },
                    audioBands: { value: new Array((CONFIG.audioReactive && CONFIG.audioReactive.bands) || 8).fill(0) },
                    scan1Pos: { value: 0.0 },
                    scan1Intensity: { value: 0.0 },
                    scan1Axis: { value: 0 },

            const i = Math.min(units.length - 1, Math.floor(Math.log(b) / Math.log(1024)));

            const d = i === 0 ? 0 : (v < 10 ? 2 : (v < 100 ? 1 : 0));

        // Raw frequency bands (Hz ranges)
        const BAND_RANGES = [
            [20, 60],       // 0: sub
            [60, 250],      // 1: bass
            [250, 500],     // 2: low-mid
            [500, 2000],    // 3: mid
            [2000, 4000],   // 4: hi-mid

        function updateAudioDrivers(nowMs) {
            if (!audioState.enabled || !audioState.analyser || !audioState.freq) return;

            const analyser = audioState.analyser;
            const buf = audioState.freq;
            const sr = audioState.sampleRate || 48000;
            const hzPerBin = sr / analyser.fftSize;
            const cfg = CONFIG.audioReactive.drivers || {};
            const gain = CONFIG.audioReactive.sensitivity || 1.0;

            // --- Layer 1: Raw 8 bands from getByteFrequencyData ---
            analyser.getByteFrequencyData(buf);

            for (let b = 0; b < Math.min(8, BAND_RANGES.length); b++) {
                const [fLow, fHigh] = BAND_RANGES[b];
                const binLow = Math.max(1, Math.floor(fLow / hzPerBin));
                const binHigh = Math.min(buf.length - 1, Math.ceil(fHigh / hzPerBin));
                let peak = 0;
                for (let i = binLow; i <= binHigh; i++) {
                    if (buf[i] > peak) peak = buf[i];
                }
                audioDrivers.raw[b] = Math.min(1.0, (peak / 255.0) * gain);
            }

            // Also write to audioState.bands for backward compat
            if (audioState.bands) {
                for (let i = 0; i < Math.min(audioState.bands.length, 8); i++) {
                    audioState.bands[i] = audioDrivers.raw[i];
                }
            }

            // --- Layer 2: Grouped bands with attack/decay ---
            const groups = cfg.groups || { bass: [0,1], mid: [2,3,4], high: [5,6], air: [7] };
            const attackMs = cfg.attackMs || 5;
            const decayMs = cfg.decayMs || 180;
            const dt = 16.67; // ~60fps frame time

            const attackAlpha = Math.min(1.0, dt / Math.max(1, attackMs));
            const decayAlpha = Math.min(1.0, dt / Math.max(1, decayMs));

            function groupPeak(indices) {
                let p = 0;
                for (const i of indices) {
                    if (audioDrivers.raw[i] > p) p = audioDrivers.raw[i];
                }
                return p;
            }

            function applyAD(current, target) {
                if (target > current) {
                    return current + (target - current) * attackAlpha;
                } else {
                    return current + (target - current) * decayAlpha;
                }
            }

            audioDrivers.bass = applyAD(audioDrivers.bass, groupPeak(groups.bass || [0,1]));
            audioDrivers.mid = applyAD(audioDrivers.mid, groupPeak(groups.mid || [2,3,4]));
            audioDrivers.high = applyAD(audioDrivers.high, groupPeak(groups.high || [5,6]));
            audioDrivers.air = applyAD(audioDrivers.air, groupPeak(groups.air || [7]));

            // Noise gate per band (high/air are naturally quieter)
            if (audioDrivers.bass < 0.15) audioDrivers.bass = 0;
            if (audioDrivers.mid < 0.15) audioDrivers.mid = 0;
            if (audioDrivers.high < 0.06) audioDrivers.high = 0;
            if (audioDrivers.air < 0.04) audioDrivers.air = 0;
            audioDrivers.energy = (audioDrivers.bass + audioDrivers.mid + audioDrivers.high + audioDrivers.air) / 4.0;

            // Update audioState.level for backward compat
            audioState.level = audioDrivers.energy;
        }

                twistEnabled: !!tw.enabled,
                twistAmountDeg: (typeof tw.amount === 'number') ? tw.amount : 0,

function craftRevealExtent() {
  const box = window.pointCloudMesh.geometry.boundingBox;
  const center = new THREE.Vector3(...CONFIG.introAnimation.centerPoint);
  let far = 0;
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) far = Math.max(far, center.distanceTo(new THREE.Vector3(x, y, z)));
  return far + CONFIG.introAnimation.scatterAmount * CONFIG.introAnimation.scatterDistanceLimit + .1;
}
function craftSetReveal(value) {
  craftProgress = Math.min(1, Math.max(0, value));
  const u = window.pointCloudMaterial.uniforms, intro = CONFIG.introAnimation;
  const t = craftProgress;
  const eased = intro.easing === 'linear' ? t : intro.easing === 'smooth' ? t * t * (3 - 2 * t) : 1 - Math.pow(1 - t, 3);
  const extent = craftRevealExtent();
  const mesh = window.pointCloudMesh, k = Math.PI / 180;
  const elapsed = t * intro.duration / 1000;
  mesh.rotation.set(
    (CONFIG.cloudRotation.x + runtimeRotationSpeed.x * elapsed) * k,
    (CONFIG.cloudRotation.y - intro.rotationDegrees * (1 - eased) + runtimeRotationSpeed.y * elapsed) * k,
    (CONFIG.cloudRotation.z + runtimeRotationSpeed.z * elapsed) * k
  );
  u.introCenterPoint.value.fromArray(intro.centerPoint);
  u.introRevealRadius.value = t >= 1 ? 999 : eased * extent;
  u.introAssemblyRadius.value = t >= 1 ? 999 : eased * (extent + intro.assemblyWaveOffset + intro.assemblyWaveThickness);
  const q = Math.min(1, Math.max(0, (t - intro.quantizeDelay) / Math.max(.001, intro.quantizeDuration)));
  const smoothQ = q * q * (3 - 2 * q);
  u.introQuantize.value = t >= 1 || !intro.scatterEffect ? 0 : intro.quantizeStart * (1 - smoothQ) + intro.quantizeEnd * smoothQ;
  if (window.gridMesh) window.gridMesh.visible = t >= 1 && CONFIG.showGrid;
  if (window.grid3DMesh) window.grid3DMesh.visible = t >= 1 && CONFIG.showGrid3D;
}
function craftReplay(from = 0) {
  craftStopReveal();
  window.__introRunning = true;
  const started = performance.now() - from * CONFIG.introAnimation.duration;
  function frame() {
    craftSetReveal((performance.now() - started) / CONFIG.introAnimation.duration);
    if (craftProgress < 1) craftIntroFrame = requestAnimationFrame(frame);
    else {
      craftStopReveal();
      startStageSystem();
      showControlsHint();
    }
  }
  frame();
}
